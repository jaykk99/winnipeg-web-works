<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winnipeg Web Works - Fund Your Project Instantly</title>
    <style>
        body {font-family: Arial, sans-serif; margin:0; padding:0; background:#fafafa; color:#222;}
        .container {max-width: 960px; margin:0 auto; padding:20px;}
        .hero {background: linear-gradient(135deg, #0d47a1, #1565c0); color:#fff; text-align:center; padding:60px 20px;}
        .hero h1 {font-size:2.2rem; margin:0 0 10px;}
        .hero p {font-size:1.2rem; margin:0 0 30px;}
        .btn {display:inline-block; background:#ffeb3b; color:#000; padding:12px 24px; font-size:1rem; font-weight:bold; text-decoration:none; border-radius:4px; margin:10px; cursor:pointer; border:none;}
        .btn:hover {background:#fdd835;}
        .btn-secondary {background:#90a4ae; color:#fff;}
        .btn-secondary:hover {background:#78909c;}
        .amount {margin:20px 0; font-size:1.2rem; text-align:center;}
        .amount span {font-weight:bold;}
        #output {margin-top:30px; padding:15px; background:#e8f5e9; border-left:4px solid #4caf50; font-family:monospace; white-space:pre-wrap; display:none;}
        .spinner {display:none; margin:20px auto; width:40px; height:40px; border:4px solid #ccc; border-top-color:#0d47a1; border-radius:50%; animation:spin 0.8s linear infinite;}
        @keyframes spin {to {transform:rotate(360deg);}}
        .hidden {display:none;}
    </style>
</head>
<body>
<div class="container">
    <!-- Hero Section -->
    <section class="hero">
        <h1>Get Your Winnipeg Web Works Project Funded Instantly – Pay with ETH on Sepolia</h1>
        <p>Skip the banks, skip the fees. Lock in your web development, SEO, and maintenance package with a single crypto transaction.</p>
        <button id="ethBtn" class="btn">Pay 0.05 ETH Now</button>
        <button id="btcBtn" class="btn btn-secondary">Pay with BTC</button>
    </section>

    <!-- Invoice Amount Display -->
    <section class="amount" id="amountSection">
        <p>Exact invoice amount: <span id="ethAmount">0.05000000 ETH</span> (~ $90.00 USD)</p>
    </section>

    <!-- Spinner and status -->
    <div id="spinner" class="spinner"></div>
    <p id="statusMsg" class="hidden"></p>

    <!-- JSON Output -->
    <pre id="output"></pre>
</div>

<script>
    const RECIPIENT_ADDRESS = '0xCc0E51687D9EbF034a3bDfBA4c859B0C78B23b06';
    const ETH_AMOUNT = '0.05';
    const BTC_AMOUNT = '0.0015'; // approximate BTC for same $ value
    const ETH_USD_RATE = 1800; // fixed for display
    const ethAmountUsd = (parseFloat(ETH_AMOUNT) * ETH_USD_RATE).toFixed(2);
    document.getElementById('ethAmount').textContent = ETH_AMOUNT + ' ETH';
    // If you want to show BTC amount similarly, could add another line.

    async function createInvoice(endpoint, amount, currency, network) {
        const response = await fetch(endpoint, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({amountEth: amount, currency, network})
        });
        if (!response.ok) throw new Error(`Invoice creation failed: ${response.status}`);
        return await response.json(); // expecting { id: '...' }
    }

    async function pollVerification(endpoint, id, intervalMs = 2000, timeoutMs = 180000) {
        const end = Date.now() + timeoutMs;
        while (Date.now() < end) {
            const resp = await fetch(endpoint.replace('{id}', id));
            if (!resp.ok) throw new Error(`Polling failed: ${resp.status}`);
            const data = await resp.json();
            if (data.status === 'paid') return data;
            await new Promise(r => setTimeout(r, intervalMs));
        }
        throw new Error('Polling timeout');
    }

    function showSpinner(show) {
        document.getElementById('spinner').style.display = show ? 'block' : 'none';
    }
    function setStatus(msg, error = false) {
        const el = document.getElementById('statusMsg');
        el.textContent = msg;
        el.className = error ? 'error' : '';
        el.classList.remove('hidden');
    }
    function hideStatus() {
        document.getElementById('statusMsg').classList.add('hidden');
    }
    function showOutput(jsonObj) {
        const out = document.getElementById('output');
        out.textContent = JSON.stringify(jsonObj, null, 2);
        out.style.display = 'block';
        console.log('Payment successful, output JSON:', jsonObj);
    }

    document.getElementById('ethBtn').addEventListener('click', async () => {
        showSpinner(true);
        setStatus('Creating ETH invoice...');
        try {
            const invoice = await createInvoice('/api/payments/invoice', ETH_AMOUNT, 'ETH', 'sepolia');
            setStatus(`Invoice created. Waiting for payment...`);
            const result = await pollVerification(`/api/payments/invoice/${invoice.id}/verify`);
            showSpinner(false);
            setStatus(`Payment confirmed! Tx hash: ${result.txHash}`);
            const jsonOutput = {
                type: 'invoice',
                method: 'ETH',
                priceModel: 'fixed',
                priceEth: ETH_AMOUNT,
                firstDollarPlan: 'Basic Winnipeg Web Works Package',
                needs: ['website', 'seo', 'maintenance']
            };
            showOutput(jsonOutput);
        } catch (err) {
            showSpinner(false);
            setStatus(`Error: ${err.message}`, true);
            console.error(err);
        }
    });

    document.getElementById('btcBtn').addEventListener('click', async () => {
        showSpinner(true);
        setStatus('Creating BTC invoice...');
        try {
            const invoice = await createInvoice('/api/payments/btc-invoice', BTC_AMOUNT, 'BTC', 'testnet'); // assuming testnet
            setStatus(`Invoice created. Waiting for payment...`);
            const result = await pollVerification(`/api/payments/btc-invoice/${invoice.id}/verify`);
            showSpinner(false);
            setStatus(`Payment confirmed! Tx hash: ${result.txHash}`);
            const jsonOutput = {
                type: 'invoice',
                method: 'BTC',
                priceModel: 'fixed',
                priceBtc: BTC_AMOUNT, // optional field
                firstDollarPlan: 'Basic Winnipeg Web Works Package',
                needs: ['website', 'seo', 'maintenance']
            };
            showOutput(jsonOutput);
        } catch (err) {
            showSpinner(false);
            setStatus(`Error: ${err.message}`, true);
            console.error(err);
        }
    });
</script>
</body>
</html>
