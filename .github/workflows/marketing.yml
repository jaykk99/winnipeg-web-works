name: Marketing engine tests
on:
  pull_request:
    paths: ['marketing/**', '.github/workflows/marketing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test marketing/core.test.mjs
      - run: node --check marketing/agent.mjs
      - run: node marketing/agent.mjs metrics marketing/example-metrics.json "$RUNNER_TEMP/marketing-metrics.json"
